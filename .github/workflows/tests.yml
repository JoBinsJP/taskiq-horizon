name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            taskiq: "taskiq==0.13.0"
            database: "sqlite"
            database_url: ""
          - python: "3.13"
            taskiq: "taskiq>=0.13.0,<0.14"
            database: "postgresql"
            database_url: "postgresql+asyncpg://horizon:horizon@127.0.0.1:5432/horizon"
          - python: "3.14"
            taskiq: "taskiq>=0.13.0,<0.14"
            database: "mysql"
            database_url: "mysql+aiomysql://horizon:horizon@127.0.0.1:3306/horizon"
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: horizon
          POSTGRES_PASSWORD: horizon
          POSTGRES_DB: horizon
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U horizon" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: horizon
          MYSQL_DATABASE: horizon
          MYSQL_USER: horizon
          MYSQL_PASSWORD: horizon
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h localhost -phorizon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: horizon
      - uses: actions/checkout@v4
        with:
          repository: JoBinsJP/alata-core
          # Test the coordinated core changes before their release is tagged.
          ref: main
          path: alata-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './alata-core[sqlite,mysql]' -e './horizon[dev]' '${{ matrix.taskiq }}'
      - run: python -m pip check
      - run: python -m ruff check taskiq_horizon tests
        working-directory: horizon
      - run: python -m ruff format --check taskiq_horizon tests
        working-directory: horizon
      - run: python -m pytest -q --tb=short
        working-directory: horizon
        env:
          HORIZON_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          HORIZON_TEST_DATABASE_URL: ${{ matrix.database_url }}
