repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: dashboard-build
        name: build dashboard assets
        entry: bash -c 'cd dashboard && npm run build && git add ../taskiq_horizon/dashboard/dist/'
        language: system
        pass_filenames: false
        files: ^dashboard/src/
        types_or: [javascript, vue, scss]

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
