site_name: TaskIQ Horizon
site_description: Queue monitoring, metrics, and worker management for Alata, powered by TaskIQ.
repo_name: taskiq-horizon
repo_url: https://github.com/JoBinsJP/taskiq-horizon

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Welcome: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Dashboard: dashboard.md
  - Architecture: architecture.md
