[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskiq-horizon"
version = "0.1.0"
description = "Laravel Horizon port for Python TaskIQ"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sajan Lamsal", email = "sajan@jobins.jp" },
    { name = "TaskIQ Horizon Contributors" }
]
dependencies = [
    "taskiq>=0.11",
    "redis[hiredis]>=5.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "fakeredis",
    "httpx",
    "ruff>=0.15",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
include = [
    "taskiq_horizon/**/*",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "UP007",  # use X | Y for union types — keep Optional for py3.9 compat
]

[tool.ruff.lint.isort]
known-first-party = ["taskiq_horizon"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
