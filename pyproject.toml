[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskiq-horizon"
version = "0.1.0"
description = "Laravel Horizon port for Python TaskIQ"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sajan Lamsal", email = "sajan@jobins.jp" },
    { name = "TaskIQ Horizon Contributors" }
]
dependencies = [
    "taskiq>=0.11",
    "redis[hiredis]>=5.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "fakeredis",
    "httpx",
]

[project.scripts]
taskiq-horizon-supervisor = "taskiq_horizon.supervisor.__main__:cli"

[tool.hatch.build.targets.wheel]
include = [
    "taskiq_horizon/**/*",
]
