[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskiq-horizon"
version = "0.2.0"
description = "Laravel Horizon port for Python TaskIQ"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sajan Lamsal", email = "sajan@jobins.jp" },
    { name = "TaskIQ Horizon Contributors" }
]
dependencies = [
    "alata>=0.12.0.1,<0.13",
    "taskiq>=0.13.0,<0.14",
    "taskiq-aio-sqs>=2.1.1,<2.2",
    "redis[hiredis]>=5.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "psutil>=5.9.0",
    "cleo>=2.1.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/JoBinsJP/taskiq-horizon"
Issues = "https://github.com/JoBinsJP/taskiq-horizon/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "fakeredis",
    "httpx",
    "ruff>=0.15",
    "pre-commit>=4.0",
    "virtualenv>=21.14.9",
    "filelock>=4.2.1",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "pymysql[rsa]>=1.1",
]

[tool.hatch.build.targets.wheel]
include = [
    "taskiq_horizon/**/*",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "**/node_modules/**",
    "**/__pycache__/**",
    "/.ruff_cache/**",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "UP007",  # use X | Y for union types — allow Optional/Union spellings
]

[tool.ruff.lint.isort]
known-first-party = ["taskiq_horizon"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
